name: CI

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # No se pide "lfs: true" a propósito: el modelo de IA (.onnx, ~170MB via
      # Git LFS) no hace falta para compilar/lintear/testear, y bajarlo en cada
      # corrida de CI consumiría la cuota mensual de ancho de banda de LFS del
      # repo muy rápido. Los tests que sí necesitan el modelo real lo detectan
      # y se saltan cuando corren en un checkout sin el contenido real de LFS.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Lint (ktlint)
        run: ./gradlew ktlintCheck

      - name: Test
        run: ./gradlew test

      - name: Build
        run: ./gradlew build
